services:
  # 1. MongoDB - For Session DB
  mongodb:
    image: mongo:latest
    container_name: mnemo-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db

  # 2. Mongo Express - UI for MongoDB
  mongo-express:
    image: mongo-express:latest
    container_name: mnemo-mongo-express
    ports:
      - "8082:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password
      ME_CONFIG_MONGODB_URL: mongodb://admin:password@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: password
    depends_on:
      - mongodb

  # 3. Postgres - For general relational data/logs
  postgres:
    image: postgres:16-alpine
    container_name: mnemo-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mnemo
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 4. Redis - For Short-term Memory Cache
  redis:
    image: redis:7-alpine
    container_name: mnemo-redis
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data

  # 5. Neo4j - For Long-term Memory Graph
  neo4j:
    image: neo4j:5.18.1
    container_name: mnemo-neo4j
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc"]' # Useful for memory evolution logic
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

volumes:
  mongodb_data:
  postgres_data:
  redis_data:
  neo4j_data:
  neo4j_logs:

