[project]
name = "mnemo"
version = "1.0.0"
description = "AI-powered memory-augmented LLM system with persistent, evolving context"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
keywords = ["ai", "memory", "graphrag", "llm", "fastapi", "neo4j", "redis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Framework :: FastAPI",
]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "asyncpg>=0.29.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "motor>=3.3.0",
    "openai>=1.3.0",
    "python-multipart>=0.0.6",
    "psycopg2-binary>=2.9.9",
    "google-genai>=1.57.0",
    "neo4j>=5.14.0",
    "redis>=5.0.1",
    "instructor>=0.4.0",
    "neo4j-graphrag>=1.12.0",
    "numpy>=2.4.1",
    "ollama>=0.1.0",
    "httpx>=0.24.0",
    "mcp[cli]>=1.2.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.11.0",
    "pytest-xdist>=3.8.0",
    "anyio>=4.0.0",
    "httpx>=0.24.0",
    "aiosqlite>=0.19.0",
    "greenlet>=3.0.0",
    "testcontainers>=3.7.1",
    "faker>=19.0.0",
    "factory-boy>=3.3.0",
    # Code Quality
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "black>=23.11.0",
    "pre-commit>=3.5.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/Mnemo"
Repository = "https://github.com/yourusername/Mnemo"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--tb=short",
    "--strict-markers",
    "--disable-warnings",
]
markers = [
    "integration: Integration tests that test API endpoints",
    "unit: Unit tests for individual functions",
    "slow: Tests that take a long time to run",
    "requires_llm: Tests that require LLM to be available",
    "requires_db: Tests that require database to be available",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "E722",  # bare except (we use bare except for fallback handling)
    "B008",  # do not perform function calls in argument defaults
    "B904",  # raise ... from err (exception chaining - not critical for this project)
    "F841",  # unused variable (some variables kept for clarity/debugging)
    "W191",  # indentation contains tabs
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Ignore unused imports in __init__.py
"tests/*" = ["F401", "F811"]  # Ignore test-specific issues

[tool.black]
line-length = 120
target-version = ["py311"]
include = '\.pyi?$'

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
]
